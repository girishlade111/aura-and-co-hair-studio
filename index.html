    <script>
      // Defensive shim: Prevent "Cannot set property fetch of #<Window> which has only a getter"
      // Ensures window.fetch provides a setter for scripts/polyfills attempting assignment

        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch || originalFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var protoFetch = proto.fetch ? proto.fetch.bind(window) : null;
              var activeProtoFetch = protoFetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return activeProtoFetch || protoFetch;
                },
                set: function(fn) {
                  activeProtoFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
